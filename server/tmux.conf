# Sovereign Terminal — tmux server configuration
# Baked into the container image at /root/.tmux.conf
# These options are set ONCE at server start, not per-session.

# Manual window sizing — lets Sovereign Terminal control dimensions via resize-window.
# Must use -s (server option), NOT -g (global session option) — using -g crashes the server.
set-option -s window-size manual

# Status bar at the bottom
set-option -g status-position bottom

# Mouse support
set -g mouse on

# True-color terminal
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Keep sessions alive on detach
set-option -g destroy-unattached off
