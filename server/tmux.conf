# Sovereign Terminal — tmux server configuration
# Every tmux command the server runs passes this file with -f; tmux reads it only when it
# starts a new tmux server (the container image also installs it as /etc/tmux.conf). The options
# apply to the whole server, not to one session.

# Status bar at the bottom
set-option -g status-position bottom

# Mouse support
set -g mouse on

# True-color terminal
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Keep sessions alive on detach
set-option -g destroy-unattached off

# Force aggressive resizing to the latest active client window to prevent center-screen floating
set-window-option -g aggressive-resize on
set-option -g window-size latest
